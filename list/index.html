<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Генератор сеток</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Генератор сеток</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">Карта</a></li>
                <li><a href="about.html">О проекте</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="map-wrapper">
            <div id="map"></div>
            
            <div class="control-panel">
                <div class="control-section">
                    <h3>Выбор региона</h3>
                    <button id="drawPolygonBtn" class="btn btn-primary">✏️ Нарисовать область</button>
                    <button id="searchRegionBtn" class="btn btn-secondary">🔍 Поиск региона</button>
                    <input type="text" id="regionSearch" placeholder="Введите название..." style="display:none">
                </div>

                <div class="control-section">
                    <h3>Проекция</h3>
                    <select id="projectionSelect">
                        <option value="mercator">Меркатор</option>
                        <option value="utm">UTM (зона автоматически)</option>
                        <option value="albers">Альберс равноплощадная</option>
                        <option value="lambert">Ламберта коническая</option>
                    </select>
                </div>

                <div class="control-section">
                    <h3>Параметры сетки</h3>
                    <label>Размер ячейки (км):
                        <input type="number" id="gridSize" value="10" min="1" max="100">
                    </label>
                    <button id="generateGridBtn" class="btn btn-success">Сгенерировать сетку</button>
                </div>

                <div class="control-section">
                    <h3>Экспорт</h3>
                    <button id="exportSVG" class="btn btn-export">SVG</button>
                    <button id="exportPNG" class="btn btn-export">PNG</button>
                    <button id="exportPDF" class="btn btn-export">PDF</button>
                    <button id="exportSHP" class="btn btn-export">SHP</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turf.js/6.5.0/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shp-write@2.0.1/dist/shpwrite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="js/navigation.js"></script>
    <script src="js/baselist2.js"></script>
    <script src="js/export.js"></script>
</body>
</html>
